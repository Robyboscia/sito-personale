name: QA Autovalutazione (bozza)
on:
  pull_request:
    branches: [main]
    paths:
      - 'autovalutazione/**'
      - 'index.html'
      - 'scripts/test-autovalutazione.cjs'
      - '.github/workflows/autovalutazione-qa.yml'
      - 'chi-sono/**'
      - 'laboratorio-del-sonno/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install test browser library
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Run homepage and landing page QA in browsers
        env:
          QA_BASE_URL: http://127.0.0.1:9876
        run: |
          python3 -m http.server 9876 --bind 127.0.0.1 >/tmp/autovalutazione-server.log 2>&1 &
          node scripts/test-autovalutazione.cjs
