name: Remove internal production notes from Stories
on:
  push:
    branches: ['diagnostics/instagram-media-20261105']
    paths:
      - 'scripts/clean_story_placeholders.py'
      - 'diagnostics/november_scheduled_assets.json'
      - '.github/workflows/clean-story-placeholders.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet pillow
      - run: python3 scripts/clean_story_placeholders.py
      - name: Commit corrected assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/clean_stories
          if ! git diff --cached --quiet; then
            git commit -m 'Store corrected user-facing Stories without editing instructions'
            git push
          fi
