name: Generate legible Instagram cover images
on:
  push:
    branches: ['diagnostics/instagram-media-20261105']
    paths:
      - 'scripts/generate_instagram_covers.py'
      - '.github/workflows/generate-instagram-covers.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  covers:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install image and video libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --user pillow --quiet
      - name: Generate bright carousel and Reel covers
        run: python3 scripts/generate_instagram_covers.py
      - name: Commit cover JPEGs to private diagnostic working branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/optimized_covers
          if ! git diff --cached --quiet; then
            git commit -m "Store Instagram RGB previews with lifted black levels"
            git push
          fi
