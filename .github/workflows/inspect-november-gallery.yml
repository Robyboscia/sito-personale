name: Review November story and carousel images
on:
  push:
    branches: ['diagnostics/instagram-media-20261105']
    paths:
      - 'diagnostics/november_scheduled_assets.json'
      - 'scripts/inspect_november_gallery.py'
      - '.github/workflows/inspect-november-gallery.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install PIL
        run: python3 -m pip install --quiet pillow
      - name: Prepare media visual audit
        run: python3 scripts/inspect_november_gallery.py
      - name: Commit sheets for review
        run: |
          git config user.name github-actions\[bot\]
          git config user.email 41898282+github-actions\[bot\]@users.noreply.github.com
          git add diagnostics/november_gallery
          if ! git diff --cached --quiet; then
            git commit -m "Store labeled visual audit contact sheets"
            git push
          fi
