name: Generate Instagram carousel images
on:
  push:
    paths:
      - 'scripts/generate_instagram_lab_sonno.py'
      - '.github/workflows/instagram-lab-sleep-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install fonts and Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-ebgaramond fonts-inter
          python3 -m pip install --user pillow --quiet
      - name: Render seven Instagram cards
        run: |
          python3 scripts/generate_instagram_lab_sonno.py
          test "$(find assets/social/laboratorio-sonno -name '*_carosello_sonno.png' | wc -l)" -eq 7
      - name: Publish media to GitHub Pages repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/social/laboratorio-sonno/
          if ! git diff --cached --quiet; then
            git commit -m "Publish seven Instagram carousel images for social sharing"
            git push
          fi
