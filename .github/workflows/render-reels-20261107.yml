name: Render actual 15-second Reels
on:
  push:
    branches: ['diagnostics/instagram-media-20261105']
    paths:
      - scripts/build_actual_reels_20261107.py
      - .github/workflows/render-reels-20261107.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install audio-video and imaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python3 -m pip install --user pillow --quiet
      - name: Render actual multi-scene Reel videos
        run: python3 scripts/build_actual_reels_20261107.py
      - name: Commit seven final Reels and cover images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/reels_final
          if ! git diff --cached --quiet; then
            git commit -m "Add seven corrected multi-scene Reels with continuous video"
            git push
          fi
